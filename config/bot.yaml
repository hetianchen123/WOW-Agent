# WowAgent 主配置 —— 由 `python -m bot.cli init-config` 生成
# 所有坐标都是“截图像素坐标”，用 `python -m bot.cli calibrate` 采集。
game_version: "1.60.1"
dry_run: false          # true = 只感知+决策，不注入任何输入
log_level: INFO
game_process_names: ["World of Warcraft"]

channel:
  x: 153                # 像素通道色条左上角（游戏内 /wagent unlock 拖动后校准）
  y: 884
  calibrated: true

capture:
  monitor: 1
  control_fps: 15
  screenshot_keep_hours: 72
  screenshot_max_mib: 256

audio:
  enabled: true
  device: null          # macOS 需要装 BlackHole 并填设备号；probe-audio 可查
  bite_threshold: 6.0

input:
  backend: auto         # auto/mac/win/mock
  mouse_turn_gain: 900
  invert_turn: false    # 游戏内转向方向反了就改 true
  estop_hotkey: "<ctrl>+<alt>+<f12>"

navigation:
  facing_convention: ccw_west   # 转向镜像时改 cw_east

# 历史大模型路线分支关闭；当前采用分割地图与本地搜索，先完成测量标定。
route_planner:
  enabled: false
  base_url: https://api.deepseek.com
  model: deepseek-flash
  credentials_file: deepseek/apikey.txt
  request_timeout_s: 12
  max_requests: 3
  staged_grounding: true
  ground_pitch_deg: 20
  overhead_observation: true  # Requires the explicit user-saved view 4; image review only until calibrated.

# 本地分割入口自动测量地面坐标并生成 NPC 搜索区域，不需要人工标定包。
segmented_navigation:
  enabled: true
  building_access: false
  models: data/segmentation/models.json
  checkpoint: data/segmentation/sam2.1_hiera_large.pt
  device: auto

fishing:
  key_cast: "1"
  key_interact: "f"
  bite_window_min_s: 3.0
  bite_window_max_s: 30.0
  bobber_roi: [0, 0, 0, 0]     # 校准：鱼漂落水区域

gathering:
  minimap_roi: [0, 0, 0, 0]    # 校准：整个小地图
  yards_per_px: 0.55
  node_click_offset: [0, 40]
  key_descend: "x"

selling:
  key_hearthstone: "2"
  key_interact: "f"
  route_to_ah: hub_to_ah
  route_to_mail: ah_to_mail
  route_return: hub_to_spot

rhythm:
  work_min_s: 5400
  work_max_s: 9000
  rest_min_s: 600
  rest_max_s: 1800
  maintenance_windows: [["Thu 05:00", "Thu 09:00"]]

notify:
  provider: none      # none | bark | serverchan
  key: ""

# 用户手动启动的门口实走测试；仅授权此摘要的网格试跑，不表示已标定/已进门。
nav3d:
  mode: visual
  mesh: data/nav3d/forever-northshire-perimeter/mesh
  forever_goldshire_mesh: data/nav3d/forever-goldshire-inn/mesh
  forever_goldshire_mesh_id: "7ce37fb637a6d2cc4af63937af4910e8e294a360913e4fe25f33483e79775551"
  forever_echo_ridge_mesh: data/nav3d/forever-echo-ridge/mesh
  forever_echo_ridge_mesh_id: "0311c3571f3e18205346e9fdf250e47e5aab766923b92a86d3faf567854e9734"
  forever_fargodeep_mesh: data/nav3d/forever-fargodeep/mesh
  forever_fargodeep_mesh_id: "7412a4bbaf06b60e398b321c50cb2f31f8772e9eb1edee7bd40b65c16e07c05f"
  alignment_file: ""
  supervised_trial_mesh_id: "fcae06ee54302e006624d00676cc651326a37b47a0d32bc9c8b1a4563a03826a"
  budget_s: 120
  max_replans: 3
  encounter_wait_s: 300
  legacy_handoff: true   # 局部分治：击杀完成后 Nav3D 走到网格出口，交回旧直线移动去交付/后续任务
